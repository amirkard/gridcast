name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gridcast
          POSTGRES_PASSWORD: gridcast
          POSTGRES_DB: gridcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://gridcast:gridcast@localhost:5432/gridcast

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest tests/ -v

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

      # Start the image and wait for /health. Building is not enough: the image
      # once built fine but could not start, because a system library was missing.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke --network host -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # The image runs as an unprivileged user; document search must still
      # load the embedding model that the build put into the image.
      - name: Check document search works as the image user
        run: docker exec smoke python -c "from gridcast.embeddings import embed_query; assert len(embed_query('total load')) == 384"

      # Install the Helm chart on a throwaway Kubernetes cluster and run its
      # test: the migration init container, the probes, the in-cluster
      # database, and the Service must all work.
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: gridcast

      - name: Lint the Helm chart
        run: helm lint deploy/helm/gridcast -f deploy/kind-values.yaml

      - name: Install the chart and run its test
        run: |
          kind load docker-image ghcr.io/${{ github.repository }}:${{ github.sha }} --name gridcast
          helm install gridcast deploy/helm/gridcast -f deploy/kind-values.yaml \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m
          helm test gridcast --logs

      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get all,pvc
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=gridcast --all-containers --tail=100

      # Publish only from master, after lint, tests, the smoke test, and the
      # Kubernetes test have passed.
      - name: Publish image to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags ghcr.io/${{ github.repository }}
