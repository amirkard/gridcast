name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gridcast
          POSTGRES_PASSWORD: gridcast
          POSTGRES_DB: gridcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://gridcast:gridcast@localhost:5432/gridcast

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest tests/ -v

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

      # Start the image and wait for /health. Building is not enough: the image
      # once built fine but could not start, because a system library was missing.
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke --network host -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # Publish only from master, after lint, tests, and the smoke test have passed.
      - name: Publish image to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags ghcr.io/${{ github.repository }}
