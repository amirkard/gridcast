[project]
name = "gridcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amir Hossein Golmohammadi", email = "golmohammadi.amirhossein93@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "holidays>=0.105",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gridcast = "gridcast:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "DTZ",           # timezone-aware datetimes
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # asserts are the point in tests
