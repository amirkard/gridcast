[project]
name = "gridcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amir Hossein Golmohammadi", email = "golmohammadi.amirhossein93@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gridcast = "gridcast:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
