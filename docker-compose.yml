services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gridcast
      POSTGRES_PASSWORD: gridcast
      POSTGRES_DB: gridcast
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridcast"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
