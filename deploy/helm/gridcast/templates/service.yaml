apiVersion: v1
kind: Service
metadata:
  name: {{ include "gridcast.fullname" . }}
  labels:
    {{- include "gridcast.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "gridcast.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
