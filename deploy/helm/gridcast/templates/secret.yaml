{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# For local clusters only. In production, set secrets.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gridcast.fullname" . }}
  labels:
    {{- include "gridcast.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.askToken }}
  ASK_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
